<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZBC — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0c0705;
      --ink-soft: #1e1008;
      --ink-muted: #7a5a50;
      --parchment: #fdf0ec;
      --gold: #e03a1e;
      --gold-light: #ff6b35;
      --border: rgba(224, 58, 30, 0.28);
      --border-hover: rgba(255, 107, 53, 0.60);
      --glass: rgba(12, 7, 5, 0.75);
      --error: #ff2d1a;
    }

    html, body {
      height: 100%;
      font-family: 'DM Mono', monospace;
      background: var(--ink);
      color: var(--parchment);
      overflow: hidden;
    }

    
    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-enter { animation: fadeInPage 0.7s cubic-bezier(0.4,0,0.2,1) forwards; }

    /* ── NOISE TEXTURE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    
    .bg-lines {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-lines::before {
      content: '';
      position: absolute;
      top: -40%;
      left: -10%;
      width: 55%;
      height: 130%;
      border-right: 1px solid rgba(224, 58, 30, 0.08);
      transform: rotate(-8deg);
    }

    .bg-lines::after {
      content: '';
      position: absolute;
      top: 20%;
      right: 8%;
      width: 1px;
      height: 60%;
      background: linear-gradient(to bottom, transparent, rgba(255, 107, 53, 0.12), transparent);
    }

    .bg-circle {
      position: fixed;
      bottom: -20vw;
      right: -10vw;
      width: 55vw;
      height: 55vw;
      border-radius: 50%;
      border: 1px solid rgba(224, 58, 30, 0.07);
      z-index: 0;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(224, 58, 30, 0.04);
    }

    .bg-circle::before {
      content: '';
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 53, 0.05);
    }

    .bg-ember {
      position: fixed;
      bottom: 5vh;
      right: 5vw;
      width: 38vw;
      height: 38vw;
      border-radius: 50%;
      background: radial-gradient(circle at 60% 60%, rgba(224, 58, 30, 0.07) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    
    .left-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3.5rem 4rem;
      border-right: 1px solid rgba(224, 58, 30, 0.12);
      position: relative;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(to bottom, #e03a1e, #ff6b35, transparent);
      opacity: 0.7;
    }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.1s;
    }

    .hero-text {
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.3s;
    }

    .hero-text .label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .hero-text .label::before {
      content: '';
      display: block;
      width: 2rem;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
    }

    .hero-text h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3rem, 5vw, 5.5rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--parchment);
    }

    .hero-text h1 em {
      font-style: italic;
      color: var(--gold-light);
    }

    .hero-text .tagline {
      margin-top: 2rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
      line-height: 1.8;
      max-width: 280px;
    }

    .left-footer {
      display: flex;
      align-items: center;
      gap: 2rem;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.6s;
    }

    .left-footer span { opacity: 0.4; }

    
    .right-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3.5rem 4rem;
    }

    .login-container {
      width: 100%;
      max-width: 360px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.5s;
    }

    .login-header {
      margin-bottom: 3rem;
    }

    .login-header p {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.6rem;
    }

    .login-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 2rem;
      color: var(--parchment);
      line-height: 1.2;
    }

    
    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.6rem;
      transition: color 0.2s;
    }

    .form-group:focus-within label {
      color: var(--gold-light);
    }

    .input-wrap {
      position: relative;
    }

    .form-group input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 0.7rem 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--parchment);
      outline: none;
      transition: border-color 0.25s;
      letter-spacing: 0.05em;
    }

    .form-group input::placeholder {
      color: rgba(253, 240, 236, 0.18);
    }

    .form-group input:focus {
      border-bottom-color: var(--gold);
    }

    .input-line {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--gold);
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-group input:focus ~ .input-line {
      width: 100%;
    }

    .toggle-pw {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-muted);
      transition: color 0.2s;
      padding: 0.25rem 0;
    }

    .toggle-pw:hover { color: var(--gold-light); }

    
    .error-msg {
      display: none;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--error);
      margin-top: 0.5rem;
    }

    .error-msg.show { display: block; }

    
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .remember-wrap input[type="checkbox"] {
      appearance: none;
      width: 12px;
      height: 12px;
      border: 1px solid var(--border-hover);
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s;
    }

    .remember-wrap input[type="checkbox"]:checked {
      background: var(--gold);
      border-color: var(--gold);
    }

    .remember-wrap input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 3px;
      width: 4px;
      height: 7px;
      border: 1px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .remember-wrap span {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .forgot-link {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover { color: var(--gold-light); }

    
    .btn-login {
      width: 100%;
      padding: 1rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--parchment);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, color 0.3s;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #e03a1e, #ff6b35);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }

    .btn-login:hover { border-color: var(--gold-light); color: #fff; }
    .btn-login:hover::before { transform: scaleX(1); }

    .btn-login span {
      position: relative;
      z-index: 1;
    }

    .btn-login.loading span::after {
      content: ' ...';
      animation: dots 1s steps(3, end) infinite;
    }

    
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(224, 58, 30, 0.18);
    }

    
    .guest-link {
      display: block;
      text-align: center;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.2s;
      padding: 0.5rem;
    }

    .guest-link:hover { color: var(--gold-light); }

    
    .success-overlay {
      position: fixed;
      inset: 0;
      background: var(--ink);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .success-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    @keyframes fadeOutPage {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    .page-exit {
      animation: fadeOutPage 0.5s ease forwards;
    }

    .success-overlay .check-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: none;
    }

    .success-overlay.show .check-ring {
      animation: ringPulse 0.6s ease forwards;
    }

    .success-overlay svg { color: var(--gold); }

    .success-overlay p {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1.2rem;
      letter-spacing: 0.15em;
      color: var(--parchment);
      font-style: italic;
    }

    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes dots {
      0%   { content: ' .'; }
      33%  { content: ' ..'; }
      66%  { content: ' ...'; }
    }

    @keyframes ringPulse {
      0%   { transform: scale(0.7); opacity: 0; }
      60%  { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    
    @media (max-width: 768px) {
      .page { grid-template-columns: 1fr; }
      .left-panel { display: none; }
      .right-panel { padding: 3rem 2rem; }
    }
  </style>
</head>
<body>

  <div class="bg-lines"></div>
  <div class="bg-circle"></div>
  <div class="bg-ember"></div>

  <div class="success-overlay" id="successOverlay">
    <div class="check-ring">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <p>Welcome back, Zoe.</p>
  </div>

  <div class="page">

    <!-- LEFT -->
    <div class="left-panel">
      <div class="wordmark">ZBC</div>

      <div class="hero-text">
        <p class="label">Portfolio</p>
        <h1>Zoe<br><em>Beatrice</em><br>Ceniza</h1>
        <p class="tagline">BSIT 2-1<br>Integrative Programming | Prof. Erwin Acorda</p>
      </div>

      <div class="left-footer">
        <span>© 2025</span>
        <span>·</span>
        <span>All rights reserved</span>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
      <div class="login-container">

        <div class="login-header">
          <p>Access Portal</p>
          <h2>Sign in to<br>continue</h2>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="your@email.com" autocomplete="username" />
            <span class="input-line"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap" style="padding-right: 2.5rem;">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
            <span class="input-line"></span>
            <button class="toggle-pw" id="togglePw" type="button" tabindex="-1">Show</button>
          </div>
          <p class="error-msg" id="errorMsg">Incorrect email or password.</p>
        </div>

        <div class="options-row">
          <label class="remember-wrap">
            <input type="checkbox" id="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password</a>
        </div>

        <button class="btn-login" id="loginBtn" type="button">
          <span>Enter Portfolio</span>
        </button>

        <div class="divider">or</div>

        <a href="#" class="guest-link">Continue as guest →</a>

      </div>
    </div>

  </div>

  <script>
    
    document.body.classList.add('page-enter');

    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');
    const pwInput = document.getElementById('password');
    const togglePw = document.getElementById('togglePw');
    const errorMsg = document.getElementById('errorMsg');
    const successOverlay = document.getElementById('successOverlay');

    // Authorized accounts
    const ACCOUNTS = {
      'erwin.acorda123@gmail.com': { password: 'Admin123', display: 'Prof. Acorda' },
      'zoe.ceniza456@gmail.com':   { password: 'Admin456', display: 'Zoe Ceniza' },
    };

    
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    // Regex: min 6 chars, at least 1 uppercase, 1 lowercase, 1 digit
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}$/;

    togglePw.addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      togglePw.textContent = isText ? 'Show' : 'Hide';
    });

    [emailInput, pwInput].forEach(el => {
      el.addEventListener('input', () => errorMsg.classList.remove('show'));
    });

    loginBtn.addEventListener('click', () => {
      const email = emailInput.value.trim();
      const pw = pwInput.value;

      
      if (!email || !pw) {
        errorMsg.textContent = 'Please fill in all fields.';
        errorMsg.classList.add('show');
        shake(loginBtn);
        return;
      }

     
      if (!emailRegex.test(email)) {
        errorMsg.textContent = 'Please enter a valid email address.';
        errorMsg.classList.add('show');
        shake(loginBtn);
        return;
      }

      
      if (!passwordRegex.test(pw)) {
        errorMsg.textContent = 'Password must be 6+ chars with uppercase, lowercase & number.';
        errorMsg.classList.add('show');
        shake(loginBtn);
        return;
      }

      loginBtn.classList.add('loading');
      loginBtn.disabled = true;

      setTimeout(() => {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;

        const account = ACCOUNTS[email];
        if (account && pw === account.password) {
          successOverlay.querySelector('p').textContent = `Welcome, ${account.display}.`;
          successOverlay.classList.add('show');
          setTimeout(() => {
            document.body.classList.add('page-exit');
            setTimeout(() => {
              window.location.href = 'Main_Page.html';
            }, 500);
          }, 1400);
        } else {
          errorMsg.textContent = 'Incorrect email or password.';
          errorMsg.classList.add('show');
          shake(loginBtn);
          pwInput.value = '';
          pwInput.focus();
        }
      }, 1400);
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') loginBtn.click();
    });

    function shake(el) {
      el.animate([
        { transform: 'translateX(0)' },
        { transform: 'translateX(-6px)' },
        { transform: 'translateX(6px)' },
        { transform: 'translateX(-4px)' },
        { transform: 'translateX(4px)' },
        { transform: 'translateX(0)' },
      ], { duration: 380, easing: 'ease-in-out' });
    }
  </script>

</body>
</html>
